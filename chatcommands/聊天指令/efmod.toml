ja = "チャットコマンドヘルパー：/get <アイテムID> [個数] でアイテム入手、/sp <NPC ID> [個数] でNPC召喚、/god で無敵モード切替（1.4.5対応）"
ko = "채팅 명령 도우미: /get <아이템ID> [개수] 아이템 지급, /sp <몹ID> [개수] 몹 소환, /god 무적 모드 토글 (1.4.5 대응)"
de = "Chat-Befehlshelfer: /get <Gegenstands-ID> [Anzahl] Gegenstände geben, /sp <NPC-ID> [Anzahl] NPCs spawnen, /god Unverwundbarkeit umschalten (angepasst an 1.4.5)"
fr = "Aide aux commandes de chat : /get <ID d'objet> [quantité] pour donner des objets, /sp <ID de PNJ> [quantité] pour faire apparaître des PNJ, /god pour activer/désactiver l'invincibilité (adapté à 1.4.5)"
it = "Assistente comandi chat: /get <ID oggetto> [quantità] per dare oggetti, /sp <ID PNG> [quantità] per generare PNG, /god per attivare/disattivare l'invincibilità (adattato a 1.4.5)"
es = "Asistente de comandos de chat: /get <ID de objeto> [cantidad] para dar objetos, /sp <ID de PNJ> [cantidad] para invocar PNJs, /god para activar/desactivar la invencibilidad (adaptado a 1.4.5)"

