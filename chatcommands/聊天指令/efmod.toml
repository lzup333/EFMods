[introduce]
zh-cn = "聊天指令助手：/get <物品ID> [数量] 给予物品，/sp <生物ID> [数量] 生成生物，/god 开关无敌模式（适配 1.4.5）"
zh-hant = "聊天指令助手：/get <物品ID> [數量] 給予物品，/sp <生物ID> [數量] 生成生物，/god 開關無敵模式（適配 1.4.5）"
