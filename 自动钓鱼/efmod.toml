[introduce]
zh-cn = "全自动钓鱼：鱼上钩自动收杆，收杆后自动抛竿，实现挂机钓鱼（手持鱼竿并在水边生效，适配 1.4.5）"
zh-hant = "全自動釣魚：魚上鉤自動收竿，收竿後自動拋竿，實現掛機釣魚（手持魚竿並在水邊生效，適配 1.4.5）"
en = "Fully automatic fishing: auto-reel when a fish bites and auto-cast after reeling, so you can AFK fish (works while holding a fishing rod near water, adapted to 1.4.5)"
ja = "完全自動釣り：魚が掛かったら自動で巻き取り、回収後は自動で再キャスト。放置釣りが可能（釣り竿を持って水辺にいると動作、1.4.5対応）"
ko = "완전 자동 낚시: 물고기가 물면 자동으로 낚아올리고 회수 후 자동으로 다시 던집니다. 방치 낚시 가능 (낚싯대를 들고 물가에서 작동, 1.4.5 대응)"
de = "Vollautomatisches Angeln: Automatisches Einholen bei Biss und erneutes Auswerfen nach dem Einholen für AFK-Angeln (funktioniert mit Angel in der Nähe von Wasser, angepasst an 1.4.5)"
fr = "Pêche entièrement automatique : ferrage automatique à la touche et relance automatique après la remontée pour pêcher en AFK (fonctionne en tenant une canne près de l'eau, adapté à 1.4.5)"
it = "Pesca completamente automatica: amo automatico al morso e rilancio automatico dopo il recupero per pescare in AFK (funziona tenendo la canna vicino all'acqua, adattato a 1.4.5)"
es = "Pesca totalmente automática: anzuelo automático al morder y relanzado automático tras recoger, para pescar AFK (funciona con la caña cerca del agua, adaptado a 1.4.5)"

